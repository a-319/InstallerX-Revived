name: Dev Branch Build & Artifact

on:
  push:
    branches-ignore:
      - 'main'
      - 'weblate-dev'
      - 'renovate/**'
    paths:
      - 'app/**'
      - 'app-process/**'
      - 'hidden-api/**'
      - 'baselineprofile/**'
      - 'build-plugins/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/auto-preview-dev.yml'

concurrency:
  group: dev-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_upload_artifact:
    # Run only if commit message does not contain [skip dev]
    if: !contains(github.event.head_commit.message, '[skip dev]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get commit short SHA
        id: commit_sha
        run: echo "SHORT_SHA=$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Accept the terms of use to suppress the caching licensing warning
          build-scan-terms-of-use-url: "https://gradle.com/help/legal-terms-of-use"
          build-scan-terms-of-use-agree: "yes"
          build-scan-publish: false
          # Allow writing to cache for dev branch
          cache-read-only: ${{ github.ref_name != 'dev' }}
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Decode and set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "${STORE_PASSWORD:-}" ] || [ -z "${KEYSTORE_BASE64:-}" ] || [ -z "${KEY_PASSWORD:-}" ] || [ -z "${KEY_ALIAS:-}" ]; then
            exit 0
          fi
          mkdir -p keystore
          echo "${KEYSTORE_BASE64}" | base64 --decode > keystore/carlyu.jks
          echo "storeFile=keystore/carlyu.jks" > keystore.properties
          echo "keyAlias=${KEY_ALIAS}" >> keystore.properties
          echo "keyPassword=${KEY_PASSWORD}" >> keystore.properties
          echo "storePassword=${STORE_PASSWORD}" >> keystore.properties

      - name: Build Dev Release APK
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew assembleOnlineUnstableRelease assembleOfflineUnstableRelease

      # Upload the online variant unzipped APK
      - name: Upload Online APK
        uses: actions/upload-artifact@v7
        with:
          name: dev-online-apk-${{ steps.commit_sha.outputs.SHORT_SHA }}
          path: app/build/outputs/apk/onlineUnstable/release/*.apk
          retention-days: 15
          archive: false

      # Upload the offline variant unzipped APK
      - name: Upload Offline APK
        uses: actions/upload-artifact@v7
        with:
          name: dev-offline-apk-${{ steps.commit_sha.outputs.SHORT_SHA }}
          path: app/build/outputs/apk/offlineUnstable/release/*.apk
          retention-days: 15
          archive: false