name: Build APK on Every Commit

on:
  push:

permissions:
  contents: read
  packages: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # versionCode comes from `git rev-list --count HEAD`; a shallow clone
          # would silently yield 1 instead of the real commit count.
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-scan-terms-of-use-url: "https://gradle.com/help/legal-terms-of-use"
          build-scan-terms-of-use-agree: "yes"
          build-scan-publish: false

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build APKs
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew assembleOnlinePreviewDebug assembleOfflinePreviewDebug -PAPP_ID="lessevil.installer"

      - name: Upload Online APK
        uses: actions/upload-artifact@v7
        with:
          name: commit-online-apk-${{ github.sha }}
          path: app/build/outputs/apk/onlinePreview/debug/*.apk
          retention-days: 7
          archive: false

      - name: Upload Offline APK
        uses: actions/upload-artifact@v7
        with:
          name: commit-offline-apk-${{ github.sha }}
          path: app/build/outputs/apk/offlinePreview/debug/*.apk
          retention-days: 7
          archive: false
