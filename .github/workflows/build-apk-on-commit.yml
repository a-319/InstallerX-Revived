name: Build APK on Every Commit

on:
  push:

permissions:
  contents: write
  packages: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # versionCode comes from `git rev-list --count HEAD`; a shallow clone
          # would silently yield 1 instead of the real commit count.
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-scan-terms-of-use-url: "https://gradle.com/help/legal-terms-of-use"
          build-scan-terms-of-use-agree: "yes"
          build-scan-publish: false

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build APKs
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew assembleOnlinePreviewDebug assembleOfflinePreviewDebug -PAPP_ID="lessevil.installer"

      - name: Prepare stable latest file names
        run: |
          cp app/build/outputs/apk/onlinePreview/debug/*.apk app/build/outputs/apk/onlinePreview/debug/InstallerX-Revived-online-latest.apk
          cp app/build/outputs/apk/offlinePreview/debug/*.apk app/build/outputs/apk/offlinePreview/debug/InstallerX-Revived-offline-latest.apk

      - name: Upload Online run artifact
        uses: actions/upload-artifact@v7
        with:
          name: commit-online-apk-${{ github.sha }}
          path: app/build/outputs/apk/onlinePreview/debug/InstallerX-Revived-online-latest.apk
          retention-days: 7
          archive: false

      - name: Upload Offline run artifact
        uses: actions/upload-artifact@v7
        with:
          name: commit-offline-apk-${{ github.sha }}
          path: app/build/outputs/apk/offlinePreview/debug/InstallerX-Revived-offline-latest.apk
          retention-days: 7
          archive: false

      - name: Publish/Update public latest APK links
        uses: softprops/action-gh-release@v3
        with:
          tag_name: commit-apk-latest
          name: Latest Commit APKs
          target_commitish: ${{ github.sha }}
          body: |
            Auto-updated APKs from the latest commit.

            Public fixed links:
            - https://github.com/${{ github.repository }}/releases/download/commit-apk-latest/InstallerX-Revived-online-latest.apk
            - https://github.com/${{ github.repository }}/releases/download/commit-apk-latest/InstallerX-Revived-offline-latest.apk
          prerelease: true
          make_latest: false
          files: |
            app/build/outputs/apk/onlinePreview/debug/InstallerX-Revived-online-latest.apk
            app/build/outputs/apk/offlinePreview/debug/InstallerX-Revived-offline-latest.apk
          overwrite_files: true
